<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080909">
  <title>THE ECOSYSTEM</title>
  <style>
    :root{--bg:#050505;--red:#e50914;--white:#f7f4f4;--muted:rgba(255,255,255,.55)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;width:100%}
    body{min-height:100vh;min-height:100svh;overflow:hidden;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center}
    body:before,body:after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(100px);opacity:.65}
    body:before{width:440px;height:440px;top:-230px;right:-130px;background:radial-gradient(circle,rgba(229,9,20,.3),transparent 70%);animation:drift 10s ease-in-out infinite alternate}
    body:after{width:500px;height:500px;bottom:-300px;left:-200px;background:radial-gradient(circle,rgba(150,0,15,.2),transparent 70%);animation:drift 13s ease-in-out infinite alternate-reverse}
    .grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.16;background-image:radial-gradient(rgba(255,255,255,.2) .55px,transparent .55px);background-size:5px 5px;mask-image:linear-gradient(transparent,#000,transparent)}
    .intro{position:relative;z-index:2;width:min(900px,90vw);text-align:center;padding:32px 18px;animation:appear 1.1s cubic-bezier(.2,.75,.25,1) both}
    .mark{width:54px;height:54px;margin:0 auto 30px;border:1px solid rgba(229,9,20,.65);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 45px rgba(229,9,20,.14);animation:markIn 1s .15s both}
    .mark span{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 20px rgba(229,9,20,.8)}
    .eyebrow{font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-bottom:24px;animation:rise .8s .25s both}
    h1{font-size:clamp(30px,6vw,68px);font-weight:800;letter-spacing:clamp(.12em,1.1vw,.28em);line-height:1.2;text-indent:.22em}
    h1 .the{display:block;font-size:.35em;letter-spacing:.48em;text-indent:.48em;color:#ffffff;margin-bottom:15px;font-weight:500}
    h1 .ecosystem{display:block;animation:rise 1s .45s both}
    h1 .ecosystem span{color:var(--red)}
    .rule{width:0;height:1px;margin:30px auto 22px;background:linear-gradient(90deg,transparent,var(--red),transparent);animation:lineIn 1.1s .75s forwards}
    .tagline{font-size:clamp(11px,1.7vw,14px);letter-spacing:.15em;color:var(--muted);line-height:1.8;animation:rise .9s .8s both}
    .bottom{position:fixed;z-index:2;left:0;right:0;bottom:30px;display:flex;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.35);font-size:9px;letter-spacing:.22em;text-transform:uppercase}
    .loader{width:26px;height:1px;background:rgba(255,255,255,.14);overflow:hidden}
    .loader:after{content:"";display:block;width:45%;height:100%;background:var(--red);animation:loading 2.8s ease-in-out forwards}
    .skip{position:fixed;z-index:3;right:24px;bottom:24px;color:rgba(255,255,255,.55);font-size:10px;letter-spacing:.14em;text-decoration:none;border:1px solid rgba(255,255,255,.17);padding:10px 14px;transition:.2s}
    .skip:hover,.skip:focus-visible{color:#fff;border-color:var(--red)}
    @keyframes appear{from{opacity:0}to{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes markIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
    @keyframes lineIn{to{width:min(230px,55vw)}}
    @keyframes loading{0%{transform:translateX(-110%)}100%{transform:translateX(240%)}}
    @keyframes drift{to{transform:translate(30px,25px) scale(1.12)}}
    @media(max-width:480px){.mark{margin-bottom:24px}.eyebrow{letter-spacing:.28em}.bottom{bottom:26px;font-size:8px}.skip{right:14px;bottom:14px;padding:8px 10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  

/* THE ECOSYSTEM — GREEN & WHITE AMBIENT THEME */
:root {
  --red: #80C995 !important;
  --red-dark: #3E8E5B !important;
  --eco-red: #80C995 !important;
  --green: #80C995;
  --eco-green: #80C995;
  --white: #FFFFFF;
  --bg: #080909;
  --panel: #111413;
  --border: rgba(128,201,149,.24);
  --muted: #A9B0AA;
}
html { background-color: #080909 !important; }
body {
  color: #FFFFFF;
  background-color: #080909;
  background-image:
    radial-gradient(ellipse at 12% 0%, rgba(128,201,149,.12), transparent 36%),
    radial-gradient(ellipse at 92% 88%, rgba(62,142,91,.10), transparent 34%);
}
/* Keep ambient effects behind content and prevent overlays from blocking clicks/text. */
body::before, body::after, .grain {
  pointer-events: none !important;
}
body::before {
  background: radial-gradient(circle, rgba(128,201,149,.20), transparent 70%) !important;
}
body::after {
  background: radial-gradient(circle, rgba(62,142,91,.14), transparent 70%) !important;
}
.logo span, .brand span, .eyebrow, .label, .category, .section-label,
.section-title span, .page-label, .location-banner small, .host-link:hover,
.connection-label, .event-category, .card-category, .back:hover,
.nav-link:hover, .forgot-link, .register-link a:hover, .admin-link:hover,
.view-link:hover, .status, .icon, .eyebrow span {
  color: #80C995 !important;
}
button, input[type="submit"], input[type="button"], .login-button,
.view-button, .view-link, .action-button, .btn, .primary-button,
.submit-button, .save-button, .cta, .register-button, a.button, a.btn,
.submit-btn, .explore-state-button {
  background: #FFFFFF !important;
  color: #237744 !important;
  border-color: rgba(128,201,149,.72) !important;
  font-weight: 800;
}
button:hover, input[type="submit"]:hover, input[type="button"]:hover,
.login-button:hover, .view-button:hover, .action-button:hover, .btn:hover,
.primary-button:hover, .submit-button:hover, .save-button:hover, .cta:hover,
.register-button:hover, a.button:hover, a.btn:hover, .submit-btn:hover,
.explore-state-button:hover {
  background: #80C995 !important;
  color: #08100B !important;
  border-color: #80C995 !important;
}
input:focus, select:focus, textarea:focus {
  border-color: #80C995 !important;
  box-shadow: 0 0 0 3px rgba(128,201,149,.12) !important;
}
.card, .panel, .form-box, .info-card, .event-card, .featured, .plan,
.profile-card, .content-card, .result-card, .local-card {
  border-color: rgba(255,255,255,.12);
}
.error, .message.error, .alert-error {
  color: #FF9DA3;
}
.success, .message.success, .alert-success, .notice-success {
  color: #B8F0C8;
  border-color: rgba(128,201,149,.32);
}
::selection { background: rgba(128,201,149,.30); color: #FFFFFF; }


/* GREEN CARD FINISH — THE ECOSYSTEM */
.card, .panel, .form-box, .info-card, .saved-card, .competition-card,
.creator-card, .event-card, .plan, .stat, .success-card, .featured,
.featured-creator, .profile-card, .content-card, .result-card, .local-card,
.business-card, .place-card, .service-card, .listing-card, .meta-item, .dashboard-card,
[class*="-card"], [class$="-tile"] {
  background: linear-gradient(145deg, #185334 0%, #103d27 100%) !important;
  border-color: rgba(128, 201, 149, .55) !important;
  color: #ffffff;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(255,255,255,.035);
}
.card h1, .card h2, .card h3, .card h4, .panel h1, .panel h2, .panel h3,
.info-card h1, .info-card h2, .info-card h3, .event-card h1, .event-card h2, .event-card h3,
[class*="-card"] h1, [class*="-card"] h2, [class*="-card"] h3, [class*="-card"] h4 {
  color: #ffffff !important;
}
.card p, .panel p, .info-card p, .event-card p, [class*="-card"] p,
.card span, .panel span, .info-card span, .event-card span, [class*="-card"] span {
  color: rgba(255,255,255,.88);
}
.card:hover, .event-card:hover, .business-card:hover, [class*="-card"]:hover {
  border-color: #80c995 !important;
  box-shadow: 0 14px 34px rgba(20, 100, 55, .24) !important;
}
</style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="intro" aria-label="THE ECOSYSTEM intro">
    <div class="mark" aria-hidden="true"><span></span></div>
    <p class="eyebrow">One country. Endless possibilities.</p>
    <h1><span class="the">WELCOME TO</span><span class="ecosystem">THE <span>ECOSYSTEM</span></span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">Discover businesses, people, places, events<br>and everything making Nigeria move.</p>
  </main>
  <div class="bottom"><span>Connecting what makes us</span><span class="loader" aria-hidden="true"></span></div>
  <a class="skip" href="{{ url_for('welcome') }}">SKIP INTRO&nbsp; ↗</a>
  <script>
    (function(){
      var destination = "{{ url_for('welcome') }}";
      var timer = window.setTimeout(function(){ window.location.href = destination; }, 4200);
      document.addEventListener('visibilitychange', function(){ if(document.hidden){window.clearTimeout(timer);} });
    })();
  </script>
</body>
</html>
